# Build and push slurm-operator container images to AWS ECR (1.0 line).
# Images pushed: slurm-operator, slurm-operator-webhook (both built from this
# repo via docker-bake.hcl's "operator"/"webhook" targets).
#
# Tagging:
#   - push to slurm-1.0-together-changes: <ECR>/slurm-operator[-webhook]:<VERSION> (from ./VERSION, no suffix)
#   - pull_request (same-repo only): ...:<VERSION>-dev-<short_sha>
#
# GitHub only evaluates workflows that exist on the ref being pushed. This file must live on
# slurm-1.0-together-changes (not only on main), or pushes to that branch will not run any workflow.
#
# OIDC: same account/role pattern as openldap-sync (github-actions-oidc-role;
# trust policy in tcloud-infra covers repo:togethercomputer/slurm-operator:*).
# Optional secret AWS_ROLE_ARN overrides the default role below.
# Optional:
#   - ROBOT_GITHUB_TOKEN

name: Container images v1.0

on:
  pull_request:
    branches:
      - slurm-1.0-together-changes
  push:
    branches:
      - slurm-1.0-together-changes
  workflow_dispatch:

env:
  REGISTRY: 651706779278.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  AWS_ROLE: arn:aws:iam::651706779278:role/github-actions-oidc-role
  RELEASE_BRANCH: slurm-1.0-together-changes

concurrency:
  group: container-images-1.0-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set image VERSION for docker-bake
        id: image-version
        run: |
          set -euo pipefail
          BASE="$(tr -d ' \n\r\t' < VERSION)"
          SHORT="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMG="${BASE}-dev-${SHORT}"
          else
            IMG="${BASE}"
          fi
          echo "version=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Image VERSION (make/docker-bake): ${IMG}"

      - name: Whether to push to Docker Hub
        id: should-push
        env:
          RELEASE_REF: refs/heads/${{ env.RELEASE_BRANCH }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "${RELEASE_REF}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "${RELEASE_REF}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep the runner compiler aligned with go.mod's toolchain directive.
          go-version: "1.25.3"

      - name: Configure git for private Go modules
        run: |
          git config --global url."https://together-robot:${ROBOT_GITHUB_TOKEN}@github.com/togethercomputer/".insteadOf "https://github.com/togethercomputer/"
        env:
          ROBOT_GITHUB_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Run lint
        run: make golangci-lint

      - name: Run tests
        run: make helm-validate test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: steps.should-push.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.should-push.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Refuse to overwrite stable image tags
        if: steps.should-push.outputs.push == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE_VERSION: ${{ steps.image-version.outputs.version }}
        run: |
          set -euo pipefail
          for image_name in slurm-operator slurm-operator-webhook; do
            image_ref="${REGISTRY}/${image_name}:${IMAGE_VERSION}"
            set +e
            inspect_output="$(docker buildx imagetools inspect "${image_ref}" 2>&1)"
            inspect_status=$?
            set -e
            if [ "${inspect_status}" -eq 0 ]; then
              echo "::error::Refusing to overwrite published image ${image_ref}"
              exit 1
            fi
            inspect_output_lower="${inspect_output,,}"
            # ECR (unlike Docker Hub) has no implicit repo creation, so a repo that
            # has never been pushed to reports "name unknown"/"repository ... does
            # not exist" rather than "manifest unknown" for a missing tag.
            if [[ "${inspect_output_lower}" != *"not found"* \
                && "${inspect_output_lower}" != *"manifest unknown"* \
                && "${inspect_output_lower}" != *"name unknown"* \
                && "${inspect_output_lower}" != *"does not exist"* ]]; then
              echo "::error::Unable to verify whether ${image_ref} already exists"
              printf '%s\n' "${inspect_output}"
              exit 1
            fi
            echo "Stable image tag is available: ${image_ref}"
          done

      - name: Build (images + charts, no registry push)
        if: steps.should-push.outputs.push != 'true'
        run: make build VERSION="${{ steps.image-version.outputs.version }}"

      - name: Package charts (push path)
        if: steps.should-push.outputs.push == 'true'
        run: make build-chart

      - name: Build and push images
        if: steps.should-push.outputs.push == 'true'
        run: make push-images VERSION="${{ steps.image-version.outputs.version }}"
